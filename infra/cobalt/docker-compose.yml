services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: vidzora-cobalt
    restart: unless-stopped
    init: true
    ports:
      - "9000:9000"
    environment:
      API_URL: "https://YOUR-COBALT-DOMAIN/"
      API_AUTH_REQUIRED: "1"
      API_KEY_URL: "file:///keys.json"
      RATELIMIT_MAX: "30"
      TUNNEL_LIFESPAN: "90"
    volumes:
      - ./keys.json:/keys.json:ro

  watchtower:
    image: containrrr/watchtower:latest
    container_name: vidzora-cobalt-watchtower
    restart: unless-stopped
    command: --cleanup --scope vidzora-cobalt --interval 900 --include-restarting
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
