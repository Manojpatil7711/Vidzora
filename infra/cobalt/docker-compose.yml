services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11.7.1-a636575
    container_name: vidzora-cobalt
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      API_URL: "https://YOUR-COBALT-DOMAIN/"
      API_NAME: "vidzora-media-1"
      API_PORT: "9000"
      CORS_WILDCARD: "0"
      CORS_URL: "https://YOUR-VIDZORA-DOMAIN"
      API_AUTH_REQUIRED: "1"
      API_KEY_URL: "file:///keys.json"
      # Covers movies up to 3 hours with a safety margin.
      DURATION_LIMIT: "14400"
      # Higher request throughput while keeping a bounded window.
      RATELIMIT_WINDOW: "60"
      RATELIMIT_MAX: "60"
      # Keep generated tunnel links available for long downloads.
      TUNNEL_LIFESPAN: "7200"
    volumes:
      - ./keys.json:/keys.json:ro

  watchtower:
    image: ghcr.io/containrrr/watchtower:latest
    container_name: vidzora-cobalt-watchtower
    restart: unless-stopped
    command: --cleanup --scope vidzora-cobalt --interval 900 --include-restarting
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
