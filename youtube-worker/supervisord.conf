[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:bgutil]
command=node /opt/bgutil-provider/build/main.js --host 127.0.0.1 --port 4416
directory=/opt/bgutil-provider
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/opt/venv/bin/uvicorn app:app --host 0.0.0.0 --port 3000
directory=/app/youtube-worker
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
